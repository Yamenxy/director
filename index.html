<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/27aaa2af-994c-4d8a-8221-c5a3674cbb9b-removebg-preview_logo.png" type="image/png">
<title>Do You Love Physics?</title>
<style>
  :root{
    --bg1:#0b0f2b;
    --bg2:#1b1440;
    --accent:#7dd3fc;
    --accent2:#a78bfa;
    --accent3:#f472b6;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.18);
  }
  *{box-sizing:border-box;}
  body,html{
    margin:0;padding:0;min-height:100%;
    font-family:'Tajawal','Cairo','Segoe UI',Arial,sans-serif;
    background: radial-gradient(circle at 20% 20%, #2d1b69 0%, transparent 45%),
                radial-gradient(circle at 80% 30%, #0f3460 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, #4a1d6e 0%, transparent 45%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
    color:#fff;
    overflow-x:hidden;
  }

  /* Cheap twinkling starfield using repeating radial-gradients (no JS, no canvas) */
  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,0.9), transparent),
      radial-gradient(1.5px 1.5px at 90px 120px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 160px 60px, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 230px 180px, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 300px 90px, rgba(255,255,255,0.5), transparent);
    background-repeat: repeat;
    background-size: 340px 220px;
    animation: twinkle 4s ease-in-out infinite alternate;
    opacity:0.7;
  }
  @keyframes twinkle{ from{opacity:0.4;} to{opacity:0.9;} }

  /* Simple orbiting atom, pure CSS, cheap on GPU */
  .atom{
    position:fixed;
    top:50%; left:50%;
    width:260px; height:260px;
    margin:-130px 0 0 -130px;
    z-index:0;
    pointer-events:none;
    opacity:0.35;
  }
  .atom .ring{
    position:absolute; inset:0;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:50%;
  }
  .atom .ring:nth-child(1){ animation: spin 12s linear infinite; }
  .atom .ring:nth-child(2){ transform: rotate(60deg); animation: spin 16s linear infinite reverse; }
  .atom .ring:nth-child(3){ transform: rotate(120deg); animation: spin 20s linear infinite; }
  .atom .ring::after{
    content:"";
    position:absolute;
    top:-4px; left:calc(50% - 4px);
    width:8px; height:8px;
    border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 10px 2px var(--accent);
  }
  .atom .ring:nth-child(2)::after{ background: var(--accent2); box-shadow: 0 0 10px 2px var(--accent2); }
  .atom .ring:nth-child(3)::after{ background: var(--accent3); box-shadow: 0 0 10px 2px var(--accent3); }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .content{
    position:relative; z-index:2;
    text-align:center;
    padding-top:16vh;
    min-height:100vh;
  }

  .badge{
    display:inline-block;
    padding:6px 18px;
    border-radius:30px;
    background: var(--glass);
    border:1px solid var(--glass-border);
    font-size:0.9em;
    letter-spacing:1px;
    margin-bottom:18px;
    color: var(--accent);
  }

  h1{
    font-size:3em;
    margin:0 0 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  p.sub{
    color: rgba(255,255,255,0.7);
    font-size:1.1em;
    margin-bottom:40px;
  }

  button{
    font-size:1.15em;
    padding:16px 34px;
    margin:10px;
    cursor:pointer;
    background: var(--glass);
    border:1px solid var(--glass-border);
    color:#fff;
    border-radius:50px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    font-family:inherit;
  }
  button:hover{
    transform: translateY(-3px) scale(1.04);
    border-color: transparent;
    background: linear-gradient(120deg, var(--accent), var(--accent2), var(--accent3));
    box-shadow: 0 10px 25px rgba(124,58,237,0.4);
  }

  #noButton{
    position:relative;
    transition: transform 0.15s ease;
  }

  #buttons{ display:none; }
  #buttons.show{
    display:block;
    animation: fadeIn 0.5s ease forwards;
  }
  #buttons h2{
    font-weight:400;
    color: rgba(255,255,255,0.75);
    margin-bottom:24px;
    font-size:1.2em;
  }
  #buttons .grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    max-width:820px;
    margin:0 auto;
    padding:0 16px;
  }
  #buttons button{
    flex:1 1 220px;
    max-width:260px;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(15px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:600px){
    h1{ font-size:2em; }
    button{ font-size:1em; padding:14px 22px; }
    .atom{ width:180px; height:180px; margin:-90px 0 0 -90px; }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="atom">
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
</div>

<div class="content">
  <div id="question">
    <div class="badge">DevSphere ⚛ Physics</div>
    <h1>Do You Love Physics?</h1>
    <p class="sub">اكتشف عالم الفيزياء بطريقة مختلفة تمامًا</p>
    <button onclick="showButtons()">Yes 🚀</button>
    <button id="noButton" onmouseover="moveButton()">No</button>
  </div>

  <div id="buttons">
    <h2>اختر صفك الدراسي</h2>
    <div class="grid">
      <button onclick="location.href='https://yamenxy.github.io/new_goto/'">الصف الاول الثانوي</button>
      <button onclick="location.href='https://yamenxy.github.io/new_goto_2/'">الصف الثاني الثانوي</button>
      <button onclick="location.href='https://yamenxy.github.io/new_goto_3/'">الصف الثالث الثانوي</button>
    </div>
  </div>
</div>

<script>
  function showButtons() {
      document.getElementById('question').style.display = 'none';
      document.getElementById('buttons').classList.add('show');
  }

  function moveButton() {
      var button = document.getElementById('noButton');
      var maxX = 120, maxY = 60;
      var x = (Math.random() - 0.5) * maxX;
      var y = (Math.random() - 0.5) * maxY;
      button.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }
</script>
</body>
</html>
